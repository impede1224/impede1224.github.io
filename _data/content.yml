### Services [ services ]
services:
  title: "What I Do"
  subtitle: "my <b>Services</b>"
  bg_title: "Services"

  items:
    - title: "NETWORK SECURITY"
      subtitle: "네트워크 보안"
      text: "iptables/방화벽 설정, 패킷 분석, 침입 탐지 실습 경험."

    - title: "SYSTEM SECURITY"
      subtitle: "시스템 보안"
      text: "Linux 서버 보안 강화, 로그 분석, 취약점 점검 경험."
    
    - title: "SECURITY TOOLe"
      subtitle: "보안 자동화"
      text: "Python/Shell 기반 보안 모니터링 도구 개발 경험."

### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "Linux" #0-10 progress in dots
        text: "Ubuntu/Kali 기반 서버 구축 및 보안 설정을 수행하고, 기본적인 명령어 및 기능을 수행할 수 있습니다."
        value: "80" #0-100 progress in %

      - label: "Python" #0-10 progress in dots
        text: "기본 문법을 구사할 수 있고, 네트워크 소켓 프로그래밍 경험이 있으며, 보안 자동화 스크립트를 개발할 수 있습니다."
        value: "75" #0-100 progress in %

  column2:
    items:
      - label: "Shell Script" #0-10 progress in dots
        text: "쉘 프로그래밍의 기본 문법을 구사할 수 있고, Bash 기반 시스템 자동화 스크립트를 작성할 수 있습니다."
        value: "65" #0-100 progress in %

      - label: "iptables" #0-10 progress in dots
        text: "iptables 방화벽 규칙을 설정하고, 패킷을 필터링하고 실시간 로그 기록을 남길 수 있습니다."
        value: "70" #0-100 progress in %

  column3:
    items:
      - label: "Packet Tracer" #0-10 progress in dots
        text: "네트워크 토폴로지 설계 및 라우팅을 설정할 수 있고, 스위치 VLAN 및 ASA 방화벽 실습 경험이 있습니다."
        value: "80" #0-100 progress in %

      - label: "Snort" #0-10 progress in dots
        text: "Snort를 사용하여 네트워크 상의 특정 패킷 감지 시에 alert 및 block 등을 수행할 수 있습니다."
        value: "65" #0-100 progress in %

